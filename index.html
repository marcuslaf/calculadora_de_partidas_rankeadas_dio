<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Ranking de Jogadores</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>🏆 Sistema de Ranking</h1>
        <div class="card">
            <h2>Calcule seu Nível</h2>
            <form id="rankingForm">
                <div class="input-group">
                    <label for="victories">Número de Vitórias:</label>
                    <input type="number" id="victories" min="0" required>
                </div>
                
                <div class="input-group">
                    <label for="defeats">Número de Derrotas:</label>
                    <input type="number" id="defeats" min="0" required>
                </div>
                
                <button type="submit">Calcular Ranking</button>
            </form>
            
            <div id="result" class="result hidden">
                <h3>Resultado:</h3>
                <div class="result-content">
                    <div class="saldo">
                        <span class="label">Saldo de Vitórias:</span>
                        <span id="saldoValue" class="value"></span>
                    </div>
                    <div class="nivel">
                        <span class="label">Nível:</span>
                        <span id="nivelValue" class="value nivel-badge"></span>
                    </div>
                    <p id="message" class="message"></p>
                </div>
            </div>
        </div>
        
        <div class="ranking-table">
            <h3>📊 Tabela de Rankings</h3>
            <table>
                <thead>
                    <tr>
                        <th>Saldo de Troféus</th>
                        <th>Nível</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td>Menos de 10</td><td class="ferro">Ferro</td></tr>
                    <tr><td>11 - 20</td><td class="bronze">Bronze</td></tr>
                    <tr><td>21 - 50</td><td class="prata">Prata</td></tr>
                    <tr><td>51 - 80</td><td class="ouro">Ouro</td></tr>
                    <tr><td>81 - 90</td><td class="diamante">Diamante</td></tr>
                    <tr><td>91 - 100</td><td class="lendario">Lendário</td></tr>
                    <tr><td>101+</td><td class="imortal">Imortal</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
